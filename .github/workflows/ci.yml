name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Python: lint + type check + tests
  # ─────────────────────────────────────────────
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest ibm_bob_geo_explorer/tests/ \
            --cov=ibm_bob_geo_explorer.src.dio_commands \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

  # ─────────────────────────────────────────────
  # TypeScript: install + type check + build
  # ─────────────────────────────────────────────
  typescript:
    name: TypeScript (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]

    defaults:
      run:
        working-directory: ibm_bob_geo_explorer/mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ibm_bob_geo_explorer/mcp/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build MCP server
        run: npm run build
